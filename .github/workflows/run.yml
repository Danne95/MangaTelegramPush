name: Run Weeb Central notifier

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9,18,21 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print run context
        run: |
          echo "Workflow run started at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Python version:"
          python --version
          echo "state.json exists?"
          if [ -f state.json ]; then echo "yes"; else echo "no"; fi

      - name: Run scraper
        env:
          WEBCOOKIE: ${{ secrets.WEBCOOKIE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: python scraper.py

      - name: Commit updated state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update manga notification state"
          git push
